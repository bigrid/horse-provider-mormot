name: mORMot LCL leak test

# ============================================================================
#  CI for the LCL memory-leak test (tests/Lazarus/lcl-leak).
#
#  WHY TWO JOBS, SPLIT BY WHAT EACH CAN DO:
#
#  * lcl-compile-ubuntu (HOSTED, reliable) — lazbuild COMPILES the LCL project.
#    This is the gate that matters most: the FPC shape units (FPC.LCL / FPC.Daemon
#    / FPC.HTTPApplication) were compiled by NO gate, which is how FIX-MORMOT-LCL-
#    COMPILE-1 (an objfpc `@`-method event assign under {$MODE DELPHI}) shipped
#    uncompiled. A lazbuild compile catches that class of regression cross-platform.
#    It does NOT run the test: on Linux FPC sets IsConsole = True for every app, so
#    THorse.Listen BLOCKS and the test would hang. Compile only here.
#
#  * lcl-run-windows (SELF-HOSTED recommended) — lazbuild + the three heaptrc
#    passes + assert. This gate catches FIX-MORMOT-SHUTDOWN-1 (abandoning a running
#    server on close AV'd mid heaptrc dump). It is faithful only on Windows, where
#    a GUI-subsystem app has IsConsole = False so Listen does not block. A hosted
#    windows-latest runner MAY run this window-less GUI app; a self-hosted runner
#    with Lazarus 4.8 already installed (the #576 environment) is the sure bet, so
#    this job is gated on a self-hosted label by default.
#
#  CHECKOUT LAYOUT: the project's .lpi uses relative unit paths that assume the
#  three repos are SIBLINGS under the workspace root:
#      <root>/horse-provider-mormot   <root>/horse   <root>/mORMot2
#  so each checkout sets `path:` accordingly. Adjust `repository:`/`ref:` to your
#  own forks (the provider depends on HashLoad/horse >= 3.3.10).
# ============================================================================

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/Lazarus/lcl-leak/**'
      - '.github/workflows/lcl-leak-ci.yml'
  pull_request:
    branches: [ "**" ]

concurrency:
  group: lcl-leak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lcl-compile-ubuntu:
    name: LCL compile (Ubuntu, lazbuild) — FIX-MORMOT-LCL-COMPILE-1 guard
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout provider
        uses: actions/checkout@v5
        with:
          path: horse-provider-mormot

      - name: Checkout Horse
        uses: actions/checkout@v5
        with:
          repository: HashLoad/horse     # or your fork
          ref: main                      # pin to a >= 3.3.10 tag/branch
          path: horse

      - name: Checkout mORMot2
        uses: actions/checkout@v5
        with:
          repository: synopse/mORMot2    # or your fork
          ref: master
          path: mORMot2

      - name: mORMot2 static libraries (Linux x86_64)
        run: |
          set -euo pipefail
          if [ ! -f mORMot2/static/x86_64-linux/libdeflatepas.a ]; then
            (cd mORMot2 && chmod +x get_latest_static.sh && ./get_latest_static.sh)
          fi

      - name: System deps (gtk2 headers for the LCL build)
        run: sudo apt-get update && sudo apt-get install -y libgtk2.0-dev

      - name: Setup Lazarus + FPC 3.2.2
        uses: gcarreno/setup-lazarus@v3.3.1
        with:
          lazarus-version: "3.6"         # bundles FPC 3.2.2; 4.8 is not offered by the action

      - name: lazbuild the LCL leak test (compile only — would hang if run on Linux)
        run: |
          set -euo pipefail
          lazbuild horse-provider-mormot/tests/Lazarus/lcl-leak/HorseMormotLclLeakTest.lpi
          echo "LCL compile OK (shape unit Horse.Provider.Mormot.FPC.LCL built)."

  lcl-run-windows:
    name: LCL compile + heaptrc run (Windows) — FIX-MORMOT-SHUTDOWN-1 gate
    # Self-hosted Windows with Lazarus 4.8 already installed is the sure bet.
    # To try a hosted runner instead, swap for: runs-on: windows-latest  (and add
    # a Setup Lazarus step like the Ubuntu job). A window-less GUI app may or may
    # not run on a hosted runner's session.
    runs-on: [self-hosted, windows, lazarus-4_8]
    steps:
      - name: Checkout provider
        uses: actions/checkout@v5
        with:
          path: horse-provider-mormot
      - name: Checkout Horse
        uses: actions/checkout@v5
        with:
          repository: HashLoad/horse
          ref: main
          path: horse
      - name: Checkout mORMot2
        uses: actions/checkout@v5
        with:
          repository: synopse/mORMot2
          ref: master
          path: mORMot2

      - name: Build + run the three heaptrc passes and assert FIXED clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proj = "horse-provider-mormot/tests/Lazarus/lcl-leak"
          # Build with the installed Lazarus 4.8 (adjust paths for the runner).
          & "C:\Lazarus\Lazarus_4_8\lazbuild.exe" --pcp=C:\lazarus\cfg_4_8 "$proj/HorseMormotLclLeakTest.lpi"
          if ($LASTEXITCODE -ne 0) { throw "lazbuild failed ($LASTEXITCODE)" }
          Push-Location $proj
          & powershell -ExecutionPolicy Bypass -File .\run-lcl-leak.ps1 -NoBuild
          # Gate: FIXED must be a clean heaptrc dump.
          if (-not (Select-String -Path .\fixed.log -Pattern '0 unfreed memory blocks : 0')) {
            Write-Host "FIXED pass not clean:"; Get-Content .\fixed.log | Select-Object -Last 5
            throw "FIXED (StopListen) did not report 0 unfreed blocks"
          }
          # Gate: ISSUE (--nostop) must now be clean too (FIX-MORMOT-SHUTDOWN-1).
          if (-not (Select-String -Path .\issue.log -Pattern 'unfreed memory blocks')) {
            Write-Host "ISSUE pass produced no heaptrc summary (crashed mid-dump?):"; Get-Content .\issue.log | Select-Object -Last 5
            throw "ISSUE (--nostop) did not finish its heaptrc dump - FIX-MORMOT-SHUTDOWN-1 regressed"
          }
          Pop-Location
          Write-Host "LCL run gate OK."
